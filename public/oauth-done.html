<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connected — Joshu</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1a1a;
        --muted: rgba(26, 26, 26, 0.65);
        --paper: #f4f2ef;
        --card: #fff;
        --accent: #2d5a4a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      main {
        width: min(28rem, 100%);
        background: var(--card);
        border: 1px solid rgba(26, 26, 26, 0.1);
        border-radius: 12px;
        padding: 1.75rem 1.5rem;
        text-align: center;
        box-shadow: 0 8px 24px rgba(26, 26, 26, 0.06);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.98rem;
      }
      button {
        margin-top: 1.25rem;
        border: none;
        border-radius: 8px;
        padding: 0.55rem 1.1rem;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }
      button:hover {
        filter: brightness(1.05);
      }
      .hint {
        margin-top: 0.85rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're connected</h1>
      <p>You can close this tab and return to Joshu.</p>
      <button type="button" id="close">Close tab</button>
      <p class="hint" id="fallback" hidden>If the tab stays open, close it manually.</p>
    </main>
    <script>
      (function () {
        var btn = document.getElementById("close");
        var fallback = document.getElementById("fallback");
        function tryClose() {
          window.close();
          // Browsers often block close unless this window was opened by script;
          // show a hint if we're still here after a beat.
          window.setTimeout(function () {
            if (!window.closed) fallback.hidden = false;
          }, 250);
        }
        btn.addEventListener("click", tryClose);
        // Soft auto-close shortly after landing (parent polls popup.closed).
        window.setTimeout(tryClose, 400);
      })();
    </script>
  </body>
</html>
