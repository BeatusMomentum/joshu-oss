<!DOCTYPE HTML>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Joshu — Reset password</title>
    <link rel="stylesheet" href="script/semantic/semantic.min.css">
    <link rel="stylesheet" href="script/ao.css">
    <link rel="stylesheet" href="script/joshu-auth-pages.css?v={{joshu_overlay_version}}">
    <script type="application/javascript" src="script/jquery.min.js"></script>
    <script type="application/javascript" src="script/semantic/semantic.min.js"></script>
    </head>
    <body class="jp-user-setup">
    <br><br><br>
    <div class="ui container" align="center">
        <div class="ui basic segment" style="max-width:440px;" align="left">
            <div class="imageRight" align="center">
                <img class="ui small image loginLogo" src="img/public/joshu-wordmark.svg" alt="Joshu">
            </div>
            <div class="ui divider"></div>
            <div class="ui text container">
                <p>Reset the desktop password on <strong>{{host_name}}</strong></p>
                <div id="joshu-recovery-panel" class="joshu-recovery-panel">
                    <p id="joshu-recovery-copy">Checking recovery options…</p>
                    <button type="button" id="joshu-recovery-send" class="ui button themecolor" hidden>Email a reset link</button>
                    <p id="joshu-recovery-status" class="joshu-recovery-status"></p>
                </div>
            </div>
            <div class="ui divider"></div>
            <p class="joshu-auth-footer"><span class="joshu-auth-version">v{{joshu_release_version}}</span></p>
            <p>Back to <a href="login.html">Sign in</a></p>
        </div>
    </div>

    <script>
        function joshuRecoveryApi(path) {
            return "/joshu/api/auth/recovery" + (path || "");
        }

        function showJoshuRecovery(mode) {
            var $copy = $("#joshu-recovery-copy");
            var $send = $("#joshu-recovery-send");
            if (mode === "email") {
                $copy.text("Email a reset link to the owner address on file. This is the password for this desk, not hello.joshu.me.");
                $send.removeAttr("hidden").show();
            } else {
                $copy.html("This desk does not email reset links. If you are locked out, SSH in as root and run <code>bash /opt/joshu/scripts/arozos-reset-password.sh YOUR_USERNAME 'new-password'</code>.");
                $send.attr("hidden", "hidden").hide();
            }
        }

        $.ajax({
            url: joshuRecoveryApi(""),
            method: "GET",
            timeout: 8000,
            success: function(data) {
                showJoshuRecovery(data && data.mode === "email" ? "email" : "ssh");
            },
            error: function() {
                $("#joshu-recovery-copy").text("Password recovery is not available on this desk right now. Try again in a minute, or contact Joshu support.");
            }
        });

        $("#joshu-recovery-send").on("click", function() {
            var $send = $(this);
            var $status = $("#joshu-recovery-status");
            $send.prop("disabled", true);
            $status.text("Sending…");
            $.ajax({
                url: joshuRecoveryApi("/request"),
                method: "POST",
                contentType: "application/json",
                data: "{}",
                timeout: 15000,
                complete: function() {
                    $send.prop("disabled", false);
                    $status.text("If an account exists for this desk, a reset email is on its way. Check the owner inbox (and spam). The current desktop password still works until you finish the email link.");
                }
            });
        });
    </script>
    </body>
</html>
